<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神牛逼还是鸣潮牛逼</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
        header { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; text-align: center; padding: 40px 20px; }
        main { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { color: #667eea; margin-bottom: 10px; }
        .list-item { padding: 5px 0; }
        .card img { width: 100%; border-radius: 8px; margin-top: 10px; }
        footer { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>
    <header>
        <h1>原神牛逼还是鸣潮牛逼</h1>
        <p>那当然是</p>
    </header>
    <main>
        <div class="card">
            <h2>明日方舟牛逼</h2>
            <p>鹰角网络牛逼</p>
        </div>
        <div class="card">
            <h2>为什么牛逼</h2>
            <div class="list-item">好玩</div>
            <div class="list-item">想不出来</div>
            <div class="list-item">1</div>
            <div class="list-item">2</div>
            <div class="list-item">3</div>
            <!-- 👇 修改 href 为你想要跳转的 html 路径 -->
            <a href="https://ak.hypergryph.com/special/ad-brand-2025/bi/index.html" class="list-item" style="cursor:pointer;text-decoration:none;display:block;" onclick="handleClick(event)">请输入文本</a>
        </div>
        <div class="card">
            <h2>官服加我</h2>
            <img src="https://cdn.phototourl.com/uploads/2026-03-20-4d7d4bf4-65d7-4f6e-80c4-53a324e5fd0b.jpg" alt="自定义文本23">
        </div>
    </main>
    <footer>
        <p>鹰角网络牛逼</p>
    </footer>
    <script>
        var clickCount = 0;
        function handleClick(e) {
            clickCount++;
            if (clickCount % 5 === 0) {
                alert("别点了，打不开就是路径弄错了");
            }
        }
    </script>
</body>
</html>
